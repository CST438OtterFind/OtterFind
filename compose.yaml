# Local stack: the API plus its own Postgres. `cp .env.example .env`, set APP_JWT_SECRET_BASE64, then `docker compose up`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: otterfind
      POSTGRES_USER: otterfind
      POSTGRES_PASSWORD: otterfind
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otterfind -d otterfind"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./api
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/otterfind
      DATABASE_USER: otterfind
      DATABASE_PASSWORD: otterfind
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

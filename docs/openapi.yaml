openapi: 3.1.0
info:
  title: OtterFind API
  version: 0.2.0
  description: >
    Hand-written contract for the OtterFind API. Add a route here, and commit it, before the
    controller that implements it. Errors follow docs/error-model.md.
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8080
    description: Local stack from `docker compose up`
paths:
  /api/buildings:
    get:
      operationId: listBuildings
      summary: List campus buildings for the map and the building picker
      description: >
        Public, because buildings are campus reference data and hold nothing about any user.
        Sorted by name, ignoring case.
      tags: [Buildings]
      security: []
      responses:
        "200":
          description: Every campus building
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
              example:
                - id: 25
                  name: Library
                  latitude: 36.65231
                  longitude: -121.79614
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/items:
    get:
      operationId: listItems
      summary: List active listings, newest first
      description: >
        Feeds both the home page and the whole-campus map. Clients work out each listing's age from
        `createdAt`, so the age is never stored or stale.
      tags: [Items]
      responses:
        "200":
          description: Every active listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createItem
      summary: Post a lost or found item, optionally with a map pin
      description: >
        The owner comes from the access token, never from the request. A pin must be on the CSUMB
        campus, and needs both coordinates or neither.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "201":
          description: The saved listing
          headers:
            Location:
              description: The new listing's URL
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getItem
      summary: View one listing
      tags: [Items]
      responses:
        "200":
          description: The listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      summary: Delete your own listing
      tags: [Items]
      responses:
        "204":
          description: The listing was deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: The access token is missing, invalid or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but this listing belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No listing has that ID
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidFields:
      description: One or more fields are invalid, and nothing was saved
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Building:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples: [Library]
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    ListingRequest:
      type: object
      required: [title, listingType, category, buildingId]
      properties:
        title:
          type: string
          minLength: 4
          maxLength: 120
          examples: [Grey tabby cat]
        listingType:
          $ref: "#/components/schemas/ListingType"
        category:
          $ref: "#/components/schemas/ListingCategory"
        buildingId:
          type: integer
          format: int64
        floor:
          type: [integer, "null"]
          minimum: -2
          maximum: 20
        description:
          type: [string, "null"]
          maxLength: 2000
        latitude:
          type: [number, "null"]
          format: double
        longitude:
          type: [number, "null"]
          format: double
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: Defaults to the time of posting. Can't be in the future.
    Listing:
      type: object
      required: [id, title, listingType, category, status, building, lastSeenAt, createdAt, mine]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        listingType:
          $ref: "#/components/schemas/ListingType"
        category:
          $ref: "#/components/schemas/ListingCategory"
        status:
          type: string
          enum: [ACTIVE, RESOLVED]
        description:
          type: [string, "null"]
        building:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        floor:
          type: [integer, "null"]
        latitude:
          type: [number, "null"]
          format: double
          description: Null when the listing has no map pin. See PRD-5.
        longitude:
          type: [number, "null"]
          format: double
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: Whether the signed-in user posted this listing.
    ListingType:
      type: string
      enum: [LOST, FOUND]
    ListingCategory:
      type: string
      enum: [PET, ELECTRONICS, KEYS, BOOKS, CLOTHING, OTHER]
    Problem:
      description: RFC 9457 Problem Details. See docs/error-model.md.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Present on a 400 for invalid fields. The client shows each message beside its field.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

openapi: 3.1.0
info:
  title: OtterFind API
  version: 0.1.0
  description: >
    Hand-written contract for the OtterFind API. Add a route here, and commit it, before the
    controller that implements it. Errors follow docs/error-model.md.
servers:
  - url: http://localhost:8080
    description: Local stack from `docker compose up`
paths:
    /api/items:
    get:
      operationId: listItems
      summary: List item reports
      tags: [Items]
      responses:
        "200":
          description: Item reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemListing"
        "401":
          $ref: "#/components/responses/ProblemResponse"

    post:
      operationId: createItem
      summary: Create a lost or found item report
      tags: [Items]
      description: >
        Requires an authenticated user. The reporter ID
        is determined by the server, not the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListing"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"

  /api/items/{id}:
    get:
      operationId: getItem
      summary: Retrieve item details
      tags: [Items]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListing"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"

  /api/buildings:
    get:
      operationId: listBuildings
      summary: List campus buildings for the map and the building picker
      description: >
        Public, because buildings are campus reference data and hold nothing about any user.
        Sorted by name, ignoring case.
      tags: [Buildings]
      security: []
      responses:
        "200":
          description: Every campus building
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
              example:
                - id: 25
                  name: Library
                  latitude: 36.65231
                  longitude: -121.79614
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  responses:
    ProblemResponse:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
      CreateItemRequest:
      type: object
      required: [itemName, category, color, isOwner]
      properties:
        itemName:
          type: string
          minLength: 4
          maxLength: 150
        category:
          type: string
          enum:
            - PHONE
            - LAPTOP
            - WALLET
            - PETS
            - BACKPACK
            - CHARGER
            - PERSONAL_ITEM
            - MISC
        color:
          type: string
          minLength: 1
          maxLength: 50
        isOwner:
          type: boolean
        buildingId:
          type: [integer, "null"]
          format: int64
        description:
          type: string
          default: ""

    ItemListing:
      type: object
      required:
        - id
        - itemName
        - category
        - color
        - isOwner
        - listingType
        - description
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
        category:
          type: string
        color:
          type: string
        isOwner:
          type: boolean
        listingType:
          type: string
          enum: [LOST, FOUND]
        buildingId:
          type: [integer, "null"]
          format: int64
        buildingName:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
          format: double
        longitude:
          type: [number, "null"]
          format: double
        description:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    Building:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples: [Library]
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Problem:
      description: RFC 9457 Problem Details. See docs/error-model.md.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

openapi: 3.1.0
info:
  title: OtterFind API
  version: 0.2.0
  description: >
    Hand-written contract for the OtterFind API. Add a route here, and commit it, before the
    controller that implements it. Errors follow docs/error-model.md.
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8080
    description: Local stack from `docker compose up`
paths:
  /auth/github:
    post:
      operationId: signInWithGitHub
      summary: Exchange a GitHub authorization code for an OtterFind session
      description: >
        Follows Appendix I. The web app sends the code, PKCE verifier and exact registered
        redirect URI. The API verifies the provider identity, reuses the account by provider ID
        or creates a USER account using its verified primary email. An email already associated
        with another identity produces 409 and never links accounts. The GitHub token is not returned.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeExchangeRequest"
      responses:
        "200":
          description: Signed in; app JWT expires after APP_JWT_TTL (default one hour)
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input, disallowed callback, rejected code or unverified primary email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Email belongs to another identity; detail names the original provider
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: GitHub is unavailable or returned an invalid identity response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: GitHub sign-in credentials are not configured on the API
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/buildings:
    get:
      operationId: listBuildings
      summary: List campus buildings for the map and the building picker
      description: >
        Public, because buildings are campus reference data and hold nothing about any user.
        Sorted by name, ignoring case.
      tags: [Buildings]
      security: []
      responses:
        "200":
          description: Every campus building
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
              example:
                - id: 25
                  name: Library
                  latitude: 36.65231
                  longitude: -121.79614
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/items:
    get:
      operationId: listItems
      summary: List active listings, newest first
      description: >
        Feeds both the home page and the whole-campus map. Clients work out each listing's age from
        `createdAt`, so the age is never stored or stale.
      tags: [Items]
      responses:
        "200":
          description: Every active listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createItem
      summary: Post a lost or found item, optionally with a map pin
      description: >
        The owner comes from the access token, never from the request. A pin must be on the CSUMB
        campus, and needs both coordinates or neither.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "201":
          description: The saved listing
          headers:
            Location:
              description: The new listing's URL
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getItem
      summary: View one listing
      tags: [Items]
      responses:
        "200":
          description: The listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      summary: Delete your own listing
      tags: [Items]
      responses:
        "204":
          description: The listing was deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/items/{itemId}/conversations:
    post:
      operationId: startConversation
      summary: Start a conversation with the person who posted an item, or reopen it
      description: >
        For PRD-6. The caller and the item's poster are the conversation's two people. Each person
        has at most one conversation per item, so asking again returns the same conversation with
        200 instead of creating a second one. You can't start a conversation about your own post.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "201":
          description: A new conversation, with no messages yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "200":
          description: The caller already has a conversation about this item, so it's returned instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: The item is the caller's own post
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No item has this ID
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/conversations:
    get:
      operationId: listConversations
      summary: List the signed-in user's conversations, most recent activity first
      description: >
        For the inbox. Only conversations the caller is in, each with its item, the other person and
        the latest message.
      tags: [Messages]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's conversations, sorted by `lastActivityAt`, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
              example:
                - id: 7
                  item:
                    id: 12
                    itemName: Grey tabby cat
                    listingType: LOST
                    buildingName: Library
                  otherParticipant:
                    id: 4
                    displayName: Maya R.
                  lastMessage:
                    id: 31
                    conversationId: 7
                    senderId: 4
                    sentByMe: false
                    text: Near the bike racks by the main entrance.
                    sentAt: "2026-11-12T20:07:00Z"
                  createdAt: "2026-11-12T20:04:00Z"
                  lastActivityAt: "2026-11-12T20:07:00Z"
        "401":
          description: No valid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Load one conversation's header details
      description: >
        Lets a conversation screen opened from a link show who it's with and which item it's about.
        Returns 404, not 403, when the caller isn't in the conversation, so nobody can tell which
        conversation IDs exist.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: No valid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No conversation has this ID, or the caller isn't in it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Load a conversation's messages, oldest first
      description: Returns 404, not 403, when the caller isn't in the conversation.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Every message in the conversation, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: No valid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No conversation has this ID, or the caller isn't in it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: sendMessage
      summary: Send a message in a conversation
      description: >
        The sender is always the caller, taken from the token and never from the request body.
        Returns 404, not 403, when the caller isn't in the conversation.
      tags: [Messages]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: The message as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: The text is empty or longer than 1000 characters after trimming
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No conversation has this ID, or the caller isn't in it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: The access token is missing, invalid or expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but this listing belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No listing has that ID
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidFields:
      description: One or more fields are invalid, and nothing was saved
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CodeExchangeRequest:
      type: object
      required: [code, codeVerifier, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 2048
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
        redirectUri:
          type: string
          maxLength: 2048
          example: http://localhost:8081/auth
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: OtterFind HS256 JWT; sub is users.id, with iss, iat, exp, email and roles claims
        user:
          type: object
          required: [id, email, displayName, role]
          properties:
            id:
              type: integer
              format: int64
            email:
              type: [string, "null"]
            displayName:
              type: string
            role:
              type: string
              enum: [USER, ADMIN]
    Building:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples: [Library]
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    ListingRequest:
      type: object
      required: [title, listingType, category, buildingId]
      properties:
        title:
          type: string
          minLength: 4
          maxLength: 120
          examples: [Grey tabby cat]
        listingType:
          $ref: "#/components/schemas/ListingType"
        category:
          $ref: "#/components/schemas/ListingCategory"
        buildingId:
          type: integer
          format: int64
        floor:
          type: [integer, "null"]
          minimum: -2
          maximum: 20
        description:
          type: [string, "null"]
          maxLength: 2000
        latitude:
          type: [number, "null"]
          format: double
        longitude:
          type: [number, "null"]
          format: double
        lastSeenAt:
          type: [string, "null"]
          format: date-time
          description: Defaults to the time of posting. Can't be in the future.
    Listing:
      type: object
      required: [id, title, listingType, category, status, building, lastSeenAt, createdAt, mine]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        listingType:
          $ref: "#/components/schemas/ListingType"
        category:
          $ref: "#/components/schemas/ListingCategory"
        status:
          type: string
          enum: [ACTIVE, RESOLVED]
        description:
          type: [string, "null"]
        building:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        floor:
          type: [integer, "null"]
        latitude:
          type: [number, "null"]
          format: double
          description: Null when the listing has no map pin. See PRD-5.
        longitude:
          type: [number, "null"]
          format: double
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: Whether the signed-in user posted this listing.
    ListingType:
      type: string
      enum: [LOST, FOUND]
    ListingCategory:
      type: string
      enum: [PET, ELECTRONICS, KEYS, BOOKS, CLOTHING, OTHER]
    Problem:
      description: RFC 9457 Problem Details. See docs/error-model.md.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          description: Present on a 400 for invalid fields. The client shows each message beside its field.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Conversation:
      description: >
        One person asking about one item, and the item's poster. Seen from the caller's side, so
        `otherParticipant` is always the person who isn't the caller.
      type: object
      required: [id, item, otherParticipant, lastMessage, createdAt, lastActivityAt]
      properties:
        id:
          type: integer
          format: int64
        item:
          $ref: "#/components/schemas/ConversationItem"
        otherParticipant:
          $ref: "#/components/schemas/Participant"
        lastMessage:
          description: The newest message, or null if nobody has written yet
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          description: When the newest message was sent, or `createdAt` if there are no messages
          type: string
          format: date-time
    ConversationItem:
      description: The item a conversation is about, as a short summary of its listing
      type: object
      required: [id, itemName, listingType, buildingName]
      properties:
        id:
          type: integer
          format: int64
        itemName:
          type: string
          examples: [Grey tabby cat]
        listingType:
          type: string
          enum: [LOST, FOUND]
        buildingName:
          type: [string, "null"]
          examples: [Library]
    Participant:
      description: A person in a conversation. Only what the other person needs to see.
      type: object
      required: [id, displayName]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
          examples: [Maya R.]
    Message:
      type: object
      required: [id, conversationId, senderId, sentByMe, text, sentAt]
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        sentByMe:
          description: True when the caller sent it, so a client can place the message without knowing its own user ID
          type: boolean
        text:
          type: string
          minLength: 1
          maxLength: 1000
        sentAt:
          type: string
          format: date-time
    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          description: Trimmed before it's checked, so it needs 1 to 1000 characters that aren't just spaces
          type: string
          minLength: 1
          maxLength: 1000
          examples: [I think I saw your cat by the library]
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64

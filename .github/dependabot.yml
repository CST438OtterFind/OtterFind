# Opens dependency update PRs once this file is on main. Each one still needs CI, two approvals and the merge
# captain, so updates are weekly, grouped and capped to keep that work small. Monday leaves time before Thursday.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    # Waiting a week gives a bad or hijacked release time to be caught.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Major versions, such as Spring Boot's, need planning, so upgrade those by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Expo app at the repo root and the map app in app/.
  - package-ecosystem: npm
    directories:
      - /
      - /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Expo SDK sets these versions together, so upgrade them with `npx expo install --fix`.
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: jest-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"

  # Workflows pin major tags like actions/checkout@v7, so major updates are the useful ones here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

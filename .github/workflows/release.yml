# Publishes the API image to GHCR for each version tag, then tells Render to deploy it. See docs/runbook.md.
name: Release

on:
  push:
    tags: ["v*"]

env:
  # Image names must be lowercase, so this can't be built from the org's mixed-case name.
  IMAGE: ghcr.io/cst438otterfind/otterfind-api

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      # The first release runs before the Render service exists, so a missing hook isn't a failure.
      - name: Deploy on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL isn't set, so the image was published but not deployed."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --get "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE:$TAG"
